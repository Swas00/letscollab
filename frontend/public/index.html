<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LetsCollab</title>
  <style>
    body {
      margin: 0;
      background: #FDFBF7;
      color: #1A1F2C;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #E2E8F0;
      border-top-color: #FF5A36;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2 style="margin: 0; font-size: 18px; font-weight: 700;">LetsCollab</h2>
  <p style="margin: 8px 0 0; font-size: 13px; color: #64748B;">Connecting to collaborative workspace...</p>
</body>
</html>
