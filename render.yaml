services:
  - type: web
    name: letscollab-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma db push && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
